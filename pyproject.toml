[project]
name = "modelszukaniepracnaukowych"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kozakini", email = "wojkom777@protonmail.com" }
]
requires-python = ">=3.10.12"
dependencies = [
    "faiss-cpu>=1.15.1",
    "gradio>=6.31.0",
    "numpy>=2.2.6",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
modelszukaniepracnaukowych = "modelszukaniepracnaukowych:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
